<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- Safari на iPhone майже не зважає на user-scalable=no: пінч або
         авто-зум при фокусі поля залишали сторінку збільшеною назавжди.
         Через це шапка з логотипом і кнопка зв'язку обрізались, а після
         вибору відділення New Post контент з'їжджав вліво. Блокуємо саме
         жестовий зум; вертикальний скрол і тапи працюють як раніше, а фото
         товару мають власний зум у галереї. -->
    <script>
      (function () {
        var block = function (e) { e.preventDefault(); };
        document.addEventListener('gesturestart', block, { passive: false });
        document.addEventListener('gesturechange', block, { passive: false });
        document.addEventListener('gestureend', block, { passive: false });

        // Страховка: якщо масштаб усе ж став більшим за 1 (системний зум,
        // повернення з іншої програми) — повертаємо його після втрати фокуса.
        var meta = document.querySelector('meta[name="viewport"]');
        var reset = function () {
          var vv = window.visualViewport;
          if (!meta || !vv || vv.scale <= 1.01) return;
          meta.setAttribute(
            'content',
            'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'
          );
          setTimeout(function () {
            meta.setAttribute(
              'content',
              'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'
            );
            window.scrollTo(0, window.scrollY);
          }, 120);
        };
        document.addEventListener('focusout', function () {
          setTimeout(reset, 200);
        });
      })();
    </script>

    <!-- Google Tag Manager -->
    <!-- Must stay a classic (non-module) script above the importmap below: an
         importmap has to be declared before any module script starts loading.

         Контейнер GTM (≈500 КБ: gtm.js + GA4 + Google Ads) давав довгі задачі
         на головному потоці й забирає TBT. Тому вантажимо його після першої
         реальної взаємодії зі сторінкою (клік/тап/клавіша/скрол колесом), а
         як страховку — через 15 с. Події, які сайт кладе в dataLayer до старту
         контейнера, не губляться: GTM обробляє чергу при ініціалізації. -->
    <script>
      (function (w, d) {
        w.dataLayer = w.dataLayer || [];
        w.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
        var started = false;
        function loadGTM() {
          if (started) return;
          started = true;
          var j = d.createElement('script');
          j.async = true;
          j.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-56NNJKTK';
          d.head.appendChild(j);
        }
        // wheel, а не scroll: програматичний скрол (пререндер, скріншоти,
        // Lighthouse) не має запускати аналітику.
        ['pointerdown', 'touchstart', 'keydown', 'wheel'].forEach(function (type) {
          w.addEventListener(type, loadGTM, { once: true, passive: true });
        });
        w.setTimeout(loadGTM, 15000);
      })(window, document);
    </script>
    <!-- End Google Tag Manager -->

    <!-- Фото товарів/категорій лежать на api.* — відкриваємо зʼєднання заздалегідь,
         щоб перше фото не чекало на DNS+TCP+TLS (200-400 мс на мобільному).
         Без crossorigin: <img> вантажить їх у no-cors режимі. -->
    <link rel="preconnect" href="https://api.teslapartscenter.com.ua" />

    <title>Tesla Parts Center | Магазин запчастин для Tesla</title>
    <!-- Назва сайту в Google. Тримаємо один чистий WebSite-вузол з тими самим
         ім'ям, що в og:site_name, title і H1 головної. -->
    <script type="application/ld+json" data-site-name="website">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Tesla Parts Center",
        "alternateName": ["Tesla Parts Center Ukraine", "Tesla Parts Center UA"],
        "url": "https://teslapartscenter.com.ua/"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://teslapartscenter.com.ua/#organization",
        "name": "Tesla Parts Center",
        "alternateName": "Tesla Parts Center Ukraine",
        "url": "https://teslapartscenter.com.ua/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://teslapartscenter.com.ua/tesla-favicon.png",
          "width": 300,
          "height": 300
        },
        "image": "https://teslapartscenter.com.ua/tesla-favicon.png",
        "telephone": "+380966363631",
        "email": "teslapartscenterua@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Харківське шосе, 6А",
          "addressLocality": "Полтава",
          "addressCountry": "UA"
        },
        "sameAs": ["https://t.me/teslapartscenter"]
      }
    </script>
    <link
      rel="icon"
      type="image/png"
      href="https://teslapartscenter.com.ua/tesla-favicon.png"
    />

    <meta property="og:site_name" content="Tesla Parts Center" />
    <meta name="application-name" content="Tesla Parts Center" />
    <meta name="apple-mobile-web-app-title" content="Tesla Parts Center" />
    <meta name="author" content="Tesla Parts Center" />
    <meta property="og:title" content="Tesla Parts Center" />
    <meta
      property="og:description"
      content="Купуйте оригінальні та перевірені запчастини для Tesla з доставкою по Україні."
    />
    <meta
      property="og:image"
      content="https://teslapartscenter.com.ua/tesla_parts_logo.jpg"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://teslapartscenter.com.ua" />

    <!-- Inter тепер self-hosted: див. index.tsx (fontsource) — прибрано
         рендер-блокуючий запит до fonts.googleapis.com -->
    <script type="importmap">
      {
        "imports": {
          "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
          "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
          "react/": "https://esm.sh/react@^19.2.3/",
          "react": "https://esm.sh/react@^19.2.3"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
