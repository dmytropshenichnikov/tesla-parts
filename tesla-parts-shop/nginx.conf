server {
  listen 80;

  # Запас на випадок завантажень через домен магазину (за замовчуванням nginx ріже 1 МБ).
  client_max_body_size 25M;
  root /usr/share/nginx/html;
  index index.html;

  # Хешовані файли Vite незмінні — кешуємо назавжди; відсутні віддаємо як 404,
  # а не як index.html (інакше стара вкладка намагається виконати HTML як JS).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # index.html завжди перевіряємо з сервером, щоб браузер не тримав старий бандл
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
    expires -1;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
