
resolver 127.0.0.11 valid=10s ipv6=off;

limit_req_zone $binary_remote_addr zone=prom_feed_limit:10m rate=10r/m;

# --- Стискування: до цього сайт віддавав JS/CSS/HTML/JSON ВЗАГАЛІ без gzip ---
# (JS бандл 525 КБ летів сирим — пряма причина LCP 13.6 с у Lighthouse на Slow 4G).
gzip on;
gzip_vary on;
# any — бо все, що йде через шлюз, це проксійовані відповіді бекенду/магазину
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_disable "msie6";
gzip_types text/plain
           text/css
           text/xml
           text/javascript
           application/json
           application/javascript
           application/xml
           application/xml+rss
           application/rss+xml
           application/atom+xml
           image/svg+xml;

# www -> основний домен (один канонічний хост для Google)
map $host $canonical_host {
    www.teslapartscenter.com.ua teslapartscenter.com.ua;
    default $host;
}

# --- 1. API (HTTPS) ---
server {
    listen 443 ssl;
    http2 on;
    server_name api.teslapartscenter.com.ua;

    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/teslapartscenter.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teslapartscenter.com.ua/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Картинки товарів (унікальні uuid-імена) — можна довго тримати в кеші браузера.
    # Раніше заголовок не ставився взагалі: Lighthouse «efficient cache lifetimes».
    location ^~ /static/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # === ДОДАНО: Захищений шлях для фіда Prom.ua ===
    location /feed/prom-ua.xml {
        # Застосовуємо ліміт із дозволом на миттєвий сплеск до 5 запитів
        limit_req zone=prom_feed_limit burst=5 nodelay;

        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# --- 2. Admin (HTTPS) ---
server {
    listen 443 ssl;
    http2 on;
    server_name admin.teslapartscenter.com.ua;

    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/teslapartscenter.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teslapartscenter.com.ua/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Те саме, що й для магазину: /api/... на власному домені замість api.*
    location /api/ {
        set $backend_upstream http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        set $admin_upstream http://admin:80;
        proxy_pass $admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # >> backup-admin
    location = /backup-admin { return 301 /backup-admin/; }
    location /backup-admin/ {
        proxy_pass http://172.18.0.1:8099/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}

# --- 3. Shop (HTTPS) ---
server {
    listen 443 ssl;
    http2 on;
    server_name www.teslapartscenter.com.ua;

    ssl_certificate /etc/letsencrypt/live/teslapartscenter.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teslapartscenter.com.ua/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    return 301 https://teslapartscenter.com.ua$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name teslapartscenter.com.ua;

    ssl_certificate /etc/letsencrypt/live/teslapartscenter.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teslapartscenter.com.ua/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /sitemap.xml {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Власний шлях до API. Магазин звертається до /api/... на СВОЄМУ домені —
    # це прибирає CORS і окремий DNS-запит до api.*, які на частині мобільних
    # пристроїв/мереж блокуються (Safari віддає «Load failed»).
    location ^~ /api/ {
        set $backend_upstream http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Статика збірки і файли з розширенням — напряму з магазину
    location ^~ /assets/ {
        set $shop_upstream http://shop:80;
        proxy_pass $shop_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ \.[A-Za-z0-9]+$ {
        set $shop_upstream http://shop:80;
        proxy_pass $shop_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Сторінки — через бекенд: index.html з мета-даними і кодом 200/301/404.
    # Якщо бекенд не відповів — звичайний index.html магазину, як раніше.
    location / {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream/prerender$request_uri;
        proxy_intercept_errors on;
        error_page 502 503 504 = @shop;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location @shop {
        set $shop_upstream http://shop:80;
        proxy_pass $shop_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# --- 4. Redirect HTTP to HTTPS (Для всіх доменів) ---
server {
    listen 80;
    server_name teslapartscenter.com.ua www.teslapartscenter.com.ua admin.teslapartscenter.com.ua api.teslapartscenter.com.ua;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$canonical_host$request_uri;
    }
}