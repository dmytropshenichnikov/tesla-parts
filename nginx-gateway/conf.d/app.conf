
resolver 127.0.0.11 valid=30s ipv6=off;

# Постійні upstream-и: proxy_pass через змінну змушував nginx резолвити
# backend/shop/admin у Docker DNS на КОЖЕН запит. Якщо Docker DNS на секунду
# затинявся — сторінка чекала відповіді сервера. Тепер імена резолвляться
# у фоні (resolve), а запити йдуть на вже відомий IP.
upstream backend_up {
    zone backend_up 64k;
    server backend:8000 resolve;
    keepalive 32;
}
upstream shop_up {
    zone shop_up 64k;
    server shop:80 resolve;
    keepalive 16;
}
upstream admin_up {
    zone admin_up 64k;
    server admin:80 resolve;
    keepalive 8;
}

# Повносторінковий мікрокеш HTML. Сторінки публічні й однакові для всіх,
# тому кешуємо відповідь на 60 с: навіть якщо бекенд/БД пригальмують,
# головна і картки товарів віддаються з пам'яті nginx за мілісекунди.
# Застарілу сторінку віддаємо, якщо бекенд помер (stale-if-error).
proxy_cache_path /var/cache/nginx/tesla_pages levels=1:2 keys_zone=tesla_pages:64m
                 inactive=2h max_size=512m use_temp_path=off;

log_format tesla_timed '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                       'rt=$request_time urt=$upstream_response_time cs=$upstream_cache_status';

limit_req_zone $binary_remote_addr zone=prom_feed_limit:10m rate=10r/m;

# --- Стискування: до цього сайт віддавав JS/CSS/HTML/JSON ВЗАГАЛІ без gzip ---
# (JS бандл 525 КБ летів сирим — пряма причина LCP 13.6 с у Lighthouse на Slow 4G).
gzip on;
gzip_vary on;
# any — бо все, що йде через шлюз, це проксійовані відповіді бекенду/магазину
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_disable "msie6";
gzip_types text/plain
           text/css
           text/xml
           text/javascript
           application/json
           application/javascript
           application/xml
           application/xml+rss
           application/rss+xml
           application/atom+xml
           image/svg+xml;

# www -> основний домен (один канонічний хост для Google)
map $host $canonical_host {
    www.teslapartscenter.com.ua teslapartscenter.com.ua;
    default $host;
}

# --- 1. API (HTTPS) ---
server {
    listen 443 ssl;
    http2 on;
    server_name api.teslapartscenter.com.ua;

    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/teslapartscenter.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teslapartscenter.com.ua/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Картинки товарів (унікальні uuid-імена) — можна довго тримати в кеші браузера.
    # Раніше заголовок не ставився взагалі: Lighthouse «efficient cache lifetimes».
    location ^~ /static/ {
        proxy_pass http://backend_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # === ДОДАНО: Захищений шлях для фіда Prom.ua ===
    location /feed/prom-ua.xml {
        # Застосовуємо ліміт із дозволом на миттєвий сплеск до 5 запитів
        limit_req zone=prom_feed_limit burst=5 nodelay;
        proxy_pass http://backend_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://backend_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# --- 2. Admin (HTTPS) ---
server {
    listen 443 ssl;
    http2 on;
    server_name admin.teslapartscenter.com.ua;

    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/teslapartscenter.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teslapartscenter.com.ua/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Те саме, що й для магазину: /api/... на власному домені замість api.*
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://admin_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # >> backup-admin
    location = /backup-admin { return 301 /backup-admin/; }
    location /backup-admin/ {
        proxy_pass http://172.18.0.1:8099/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}

# --- 3. Shop (HTTPS) ---
server {
    listen 443 ssl;
    http2 on;
    server_name www.teslapartscenter.com.ua;

    ssl_certificate /etc/letsencrypt/live/teslapartscenter.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teslapartscenter.com.ua/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    return 301 https://teslapartscenter.com.ua$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name teslapartscenter.com.ua;

    # Час відповіді в логах: rt — скільки чекав клієнт, urt — бекенд, cs — HIT/MISS.
    access_log /dev/stdout tesla_timed;

    ssl_certificate /etc/letsencrypt/live/teslapartscenter.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teslapartscenter.com.ua/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /sitemap.xml {
        proxy_pass http://backend_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Власний шлях до API. Магазин звертається до /api/... на СВОЄМУ домені —
    # це прибирає CORS і окремий DNS-запит до api.*, які на частині мобільних
    # пристроїв/мереж блокуються (Safari віддає «Load failed»).
    location ^~ /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Фото товарів/категорій віддаємо зі СВОГО домену. Окремий api.* означає
    # ще один DNS+TCP+TLS у критичному шляху LCP (у Lighthouse — до ~120 мс),
    # хоча файли лежать на цьому ж сервері.
    location ^~ /static/images/ {
        proxy_pass http://backend_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Статика збірки і файли з розширенням — напряму з магазину
    location ^~ /assets/ {
        proxy_pass http://shop_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ \.[A-Za-z0-9]+$ {
        proxy_pass http://shop_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Сторінки — через бекенд: index.html з мета-даними і кодом 200/301/404.
    # Якщо бекенд не відповів — звичайний index.html магазину, як раніше.
    location / {
        proxy_pass http://backend_up/prerender$request_uri;
        proxy_intercept_errors on;
        error_page 502 503 504 = @shop;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;

        # HTML-кеш: ключ без query, бо prerender залежить лише від шляху
        # (UTM/gclid не створюють окремих копій сторінки).
        proxy_cache tesla_pages;
        proxy_cache_key "$scheme$host$uri";
        # 10 s, а не 60: після деплою старий index.html посилається на вже
        # видалені чанки і дає білу сторінку. Вікно застарілого HTML має бути
        # якомога коротшим.
        proxy_cache_valid 200 10s;
        proxy_cache_valid 301 302 10m;
        # 404 не кешуємо: інакше відсутній чанк «залипає» на хвилину.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        # Бекенд віддає no-cache для HTML — для публічної сторінки це зайве,
        # інакше nginx взагалі нічого не закешує.
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location @shop {
        proxy_pass http://shop_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# --- 4. Redirect HTTP to HTTPS (Для всіх доменів) ---
server {
    listen 80;
    server_name teslapartscenter.com.ua www.teslapartscenter.com.ua admin.teslapartscenter.com.ua api.teslapartscenter.com.ua;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$canonical_host$request_uri;
    }
}