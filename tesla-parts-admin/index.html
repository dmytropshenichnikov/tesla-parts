<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tesla Parts Admin</title>
    <link rel="icon" type="image/png" href="/tesla_logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Без цього `text-tesla-red` / `bg-tesla-red` / `focus:ring-tesla-red`
      // у Tailwind з CDN не існували: текст лишався білим на прозорому фоні,
      // тобто кнопки ставали невидимими.
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'tesla-red': '#E82127',
              'tesla-dark': '#171A20',
            },
            fontFamily: {
              manrope: ['Manrope', 'Inter', 'sans-serif'],
              montserrat: ['Montserrat', 'Inter', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      .font-manrope {
        font-family: 'Manrope', 'Inter', sans-serif;
      }
      .font-montserrat {
        font-family: 'Montserrat', 'Inter', sans-serif;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react/": "https://esm.sh/react@^19.2.3/",
          "react": "https://esm.sh/react@^19.2.3",
          "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
          "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
          "recharts": "https://esm.sh/recharts@^3.5.1",
          "react-router-dom": "https://esm.sh/react-router-dom@^7.10.1"
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
