server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Хешовані файли Vite (index-<hash>.js/css) ніколи не змінюються під тим самим
  # імʼям — тому їх можна кешувати назавжди. Якщо файл зник (стара вкладка
  # просить старий бандл) — віддаємо чесний 404, а не index.html, інакше браузер
  # намагається виконати HTML як JavaScript.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # index.html ЗАВЖДИ перевіряємо з сервером. Без цього браузер тримає старий
  # бандл із кешу, і здається, що правки «не задеплоїлись».
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
    expires -1;
  }

  # SPA: будь-який маршрут віддає index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
